<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlantMarket Admin</title><link rel="stylesheet" href="/admin.css"></head><body><main class="admin"><section class="panel"><p class="eyebrow">PlantMarket 3.0</p><h1>Админка</h1><p>Редактируйте тексты, цвета и смотрите заявки/статистику.</p><label>Пароль администратора<input id="pass" type="password" placeholder="ADMIN_PASSWORD"></label><button id="loadBtn">Войти</button><p id="status"></p></section><section id="editor" class="panel hidden"><h2>Тексты приложения</h2><div class="grid"><label>Название<input id="appTitle"></label><label>Версия<input id="versionLabel"></label><label>Подзаголовок<textarea id="subtitle"></textarea></label><label>PRO заголовок<input id="proTitle"></label><label>PRO текст<textarea id="proText"></textarea></label><label>Кнопка бота<input id="botButtonText"></label><label>Текст бота<textarea id="botStartText"></textarea></label><label>Цвет акцента<input id="accent" type="color"></label><label>Фон<input id="bg" type="color"></label></div><button id="saveBtn">Сохранить настройки</button></section><section id="stats" class="panel hidden"><h2>Статистика</h2><div class="cards"><div><b id="calcCount">0</b><span>расчетов</span></div><div><b id="userCount">0</b><span>пользователей</span></div><div><b id="leadCount">0</b><span>заявок</span></div></div><h3>Последние заявки</h3><div id="leads"></div></section></main><script src="/admin.js"></script></body></html>
